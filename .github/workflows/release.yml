name: Build and release Windows package

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v1.2.0); leave empty to build only'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-package-${{ inputs.tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Resolve release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $tag = ''
          if ($env:EVENT_NAME -eq 'release') { $tag = $env:RELEASE_TAG }
          elseif ($env:EVENT_NAME -eq 'workflow_dispatch') { $tag = $env:INPUT_TAG }
          elseif ($env:EVENT_NAME -eq 'push' -and $env:REF_TYPE -eq 'tag') { $tag = $env:REF_NAME }
          if ($tag -and $tag -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$') {
            throw 'Use a version tag such as v1.2.0 or v1.2.0-beta.1.'
          }
          $publish = if ($tag) { 'true' } else { 'false' }
          $sourceRef = if ($tag) { "refs/tags/$tag" } else { $env:SOURCE_REF }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT
          "source_ref=$sourceRef" >> $env:GITHUB_OUTPUT

      # Keep build tooling from the workflow revision so manual rebuilds also support older tags.
      - name: Check out build tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.source_ref }}
          path: source
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build, verify and package
        id: package
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          & ./tooling/.github/scripts/Build-Release.ps1 -ProjectDirectory "$env:GITHUB_WORKSPACE/source" -Tag $env:RELEASE_TAG

      - name: Save Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-${{ github.run_attempt }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release-${{ github.run_attempt }}
          path: package

      - name: Create release or update assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          cd package
          asset="DNFProcessManager-${RELEASE_TAG}-win-x64.zip"
          sha256sum --check "${asset}.sha256"
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$asset" "${asset}.sha256" --clobber
          else
            options=(--verify-tag --title "DNF Process Manager ${RELEASE_TAG}" --generate-notes)
            if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "$asset" "${asset}.sha256" "${options[@]}"
          fi
